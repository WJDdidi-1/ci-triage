# Publish to npm via trusted publishing (OIDC, no long-lived token).
#
# npm side (one-time, done by the repo owner at npmjs.com):
#   package ci-triage-cli -> Settings -> Publishing access ->
#   Trusted publisher: GitHub Actions, repository WJDdidi-1/ci-triage,
#   workflow publish.yml (this file), no environment.
# After that, creating a GitHub release publishes the tagged version.
# Manual runs are also possible from the Actions tab (workflow_dispatch).

name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11
      - run: npm test
      - run: npm publish --provenance --access public
